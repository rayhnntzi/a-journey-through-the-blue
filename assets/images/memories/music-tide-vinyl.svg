  <g fill="none" stroke="#B9E8F5" stroke-opacity="0.16" stroke-width="1.2">
    <circle cx="400" cy="250" r="136"/><circle cx="400" cy="250" r="118"/><circle cx="400" cy="250" r="100"/><circle cx="400" cy="250" r="82"/>
  </g>
