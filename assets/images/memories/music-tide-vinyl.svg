    <line x1="120" y1="226" x2="120" y2="274"/><line x1="138" y1="208" x2="138" y2="292"/><line x1="156" y1="222" x2="156" y2="278"/>
    <line x1="644" y1="222" x2="644" y2="278"/><line x1="662" y1="206" x2="662" y2="294"/><line x1="680" y1="228" x2="680" y2="272"/>
