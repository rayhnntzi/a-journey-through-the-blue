  <circle cx="400" cy="250" r="46" fill="#123F67" stroke="#B9E8F5" stroke-width="2"/>
  <circle cx="400" cy="250" r="9" fill="#F4FBFF"/>
  <!-- Minimalist turntable tonearm -->
