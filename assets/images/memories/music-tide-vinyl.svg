<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <radialGradient id="bg" cx="50%" cy="46%" r="74%">
      <stop offset="0%" stop-color="#1E5B8A"/>
      <stop offset="56%" stop-color="#0A2540"/>
      <stop offset="100%" stop-color="#051326"/>
    </radialGradient>
    <radialGradient id="vinyl" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#B9E8F5"/>
      <stop offset="22%" stop-color="#246A9B"/>
      <stop offset="25%" stop-color="#071C36"/>
      <stop offset="100%" stop-color="#0C2C4E"/>
    </radialGradient>
  </defs>
  <rect width="800" height="500" fill="url(#bg)"/>
  <!-- Concentric underwater sound wave ripples -->
  <g fill="none" stroke="#70C9E8">
