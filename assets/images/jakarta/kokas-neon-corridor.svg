  <rect x="112" y="196" width="96" height="42" rx="6" fill="#0A2540" stroke="#70C9E8" stroke-opacity="0.75" stroke-width="1.6"/>
  <rect x="592" y="196" width="96" height="42" rx="6" fill="#0A2540" stroke="#B9E8F5" stroke-opacity="0.75" stroke-width="1.6"/>
