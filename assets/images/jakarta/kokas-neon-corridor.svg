      <stop offset="0%" stop-color="#06162D"/>
      <stop offset="55%" stop-color="#0B2748"/>
      <stop offset="100%" stop-color="#051225"/>
    </linearGradient>
    <radialGradient id="vanish" cx="50%" cy="46%" r="48%">
